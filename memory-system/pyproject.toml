[project]
name = "memory-system"
version = "0.1.0"
description = ""
authors = [
    {name = "FrancoAseglio",email = "aseglio.f@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool] (>=3.3.6,<4.0.0)",
    "pgvector (>=0.5.1,<0.6.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "ollama (>=0.6.3,<0.7.0)",
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "apscheduler (>=3.11.3,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]

[tool.poetry]
packages = [{include = "memory_system", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "streamlit (>=1.66.1,<2.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "ruff (>=0.17.2,<0.18.0)"
]
