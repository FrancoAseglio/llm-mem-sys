[project]
name = "memory-system"
version = "0.1.0"
description = "A long-term memory prototype for an LLM assistant, measured against vector search"
license = "MIT"
authors = [
    {name = "FrancoAseglio",email = "aseglio.f@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool] (>=3.3.6,<4.0.0)",
    "pgvector (>=0.5.1,<0.6.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "ollama (>=0.6.3,<0.7.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
]

[tool.poetry.group.analysis]
optional = true  # the results notebook only: poetry install --with analysis

[tool.poetry.group.dashboard]
optional = true  # the local dashboard only: poetry install --with dashboard

[tool.poetry]
packages = [
    {include = "memory_system", from = "src"},
    {include = "evaluation"},
    {include = "dashboard"},
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.2,<0.18.0)"
]
analysis = [
    "pandas (>=3.1.0,<4.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "nbconvert (>=7.17.2,<8.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "plotly (>=7.1.0,<8.0.0)",
    "kaleido (>=1.5.0,<2.0.0)"
]
dashboard = [
    "fastapi (>=0.162.0,<0.163.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "httpx2 (>=2.16.0,<3.0.0)"  # FastAPI's test client, for tests/dashboard
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["docs"]  # markdown is written by hand; do not reformat code blocks

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
