# Lint and test on every push to main and every pull request.
# The database tests run against a throwaway Postgres 17 with pgvector (pg_trgm ships with
# Postgres). No Ollama is needed: every test replaces the model and the embeddings.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: memory-system

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/memory_db

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Create the schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f schema.sql

      - name: Lint
        run: poetry run ruff check .

      - name: Format
        run: poetry run ruff format --check .

      - name: Tests
        run: poetry run pytest -q
