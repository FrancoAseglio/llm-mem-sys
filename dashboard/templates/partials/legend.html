{# What the colours of the memory lines mean. #}
<p class="legend">
  <span class="line-message" title="a past user message">message</span>
  <span class="line-fact" title="an extracted fact">fact</span>
  <span class="line-note" title="an episode note">note</span>
  <span class="line-marked" title="a line hybrid marks as no longer current">marked as old</span>
</p>
