<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} · Memory system</title>
  <script>
    (() => {
      let theme = null;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Memory system</a>
      <nav>
        <a href="/" class="{{ 'active' if page == 'home' }}">Overview</a>
        <a href="/results" class="{{ 'active' if page == 'results' }}">Results</a>
        <a href="/inspector" class="{{ 'active' if page == 'inspector' }}">Inspector</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch light or dark theme">Theme</button>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
